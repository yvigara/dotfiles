[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node"]
pin = true
trusted_config_paths = ["{{ env.XDG_PROJECTS_DIR }}"]
go_set_gobin = false
go_set_goroot = true
env_cache = true
minimum_release_age = "2d"
npm.package_manager = "aube"

[settings.github]
oauth_client_id = "Iv23liX49yGQdh8FIgC4"

[tools]
node = "26"
"npm:defuddle" = "0.18.1"
"npm:@cometix/ccline" = "1.1.2"
uv = "latest"
"npm:@tobilu/qmd" = { version = "2.5.3", allow_builds = ["better-sqlite3"] }
"npm:@rivolink/leaf" = "1.24.0"
pitchfork = { version = "2.11.0", postinstall = "pitchfork boot enable" }
"npm:gitnexus" = { version = "1.6.5", allow_builds = ["@ladybugdb/core"] }
"npm:@bitbonsai/mcpvault" = "0.11.0"
aube = "1.16.1"
