[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node"]
pin = true
lockfile = true
locked_scopes = ["project"]
trusted_config_paths = ["{{ env.XDG_PROJECTS_DIR }}"]
env_cache = true
env_conf_d = true
minimum_release_age = "2d"

[settings.github]
gh_cli_tokens = true
oauth_client_id = "Iv23liX49yGQdh8FIgC4"
oauth_export_env = ""

[settings.go]
set_gobin = false
set_goroot = true

[settings.npm]
package_manager = "aube"

[settings.node]
compile = false

[settings.python]
compile = false
uv_venv_auto = "create|source"

[settings.ruby]
compile = false

[tools]
node = "26"
"npm:defuddle" = "0.19.4"
"npm:@cometix/ccline" = "1.1.2"
uv = "latest"
"npm:@tobilu/qmd" = { version = "2.8.3", allow_builds = ["better-sqlite3"] }
pitchfork = { version = "2.25.0", postinstall = "pitchfork boot enable" }
aube = "2.2.17"
"npm:@firecrawl/anydoc" = "0.2.4"
"go:github.com/eleboucher/memini/cmd/memini" = "0.7.29"
"npm:@zvec/zvec-grep" = "0.2.2"
